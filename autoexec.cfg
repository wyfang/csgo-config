bind "TAB" "+wangyifang";
alias "+wangyifang" "+showscores; net_graphheight 0";
alias "-wangyifang" "-showscores; net_graphheight 2000";
bind "F1" "+wangyifang2"
alias "+wangyifang2" "+jump;-attack"
alias "-wangyifang2" "-jump"
alias wangyifangclanid 
bind "/" "+holdToMute"
alias "+holdToMute" "-voicerecord"
alias "-holdToMute" "+voicerecord"
bind i wifi-crosshair1
alias wifi-crosshair1 "exec wifi-crosshair1;bind i wifi-crosshair2"
alias wifi-crosshair2 "exec wifi-crosshair2;bind i wifi-crosshair3"
alias wifi-crosshair3 "exec wifi-crosshair3;bind i wifi-crosshair1" 